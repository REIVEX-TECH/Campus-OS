name: Ingest LGU timetable

# Scheduled FULL ingest against the HOSTED database.
#
# Gated by the repo VARIABLE `HOSTED_DB_ENABLED`: scheduled runs execute only
# when it is 'true', so this never runs before a hosted DB exists. Manual runs
# (workflow_dispatch) always execute. To turn it on after the hosted DB is ready
# (see docs/DEPLOY.md):
#   1. Add repo secret DATABASE_URL (the Neon pooled connection string).
#   2. Set repo variable HOSTED_DB_ENABLED = true.
# The portal session is autonomous (no cookie); the LGU_PHPSESSID secret is an
# OPTIONAL override only. If the portal is flaky, the crawl retries and, failing
# that, opens an issue via the notify step.

on:
  workflow_dispatch:
  schedule:
    # Timetables change rarely; twice a day is plenty. Times are UTC.
    - cron: '0 3,15 * * *'

concurrency:
  group: ingest-lgu
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Scheduled runs need the gate; a human dispatch always runs.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HOSTED_DB_ENABLED == 'true' }}
    env:
      SOURCE_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LGU_PHPSESSID: ${{ secrets.LGU_PHPSESSID }} # optional; blank = autonomous session
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations (idempotent)
        run: pnpm db:migrate:all

      - name: Run full ingestion
        run: pnpm ingest:lgu

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `LGU ingestion failed: run ${context.runId}`;
            const body =
              `The scheduled LGU timetable ingestion failed.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ingestion', 'bug'],
            });
