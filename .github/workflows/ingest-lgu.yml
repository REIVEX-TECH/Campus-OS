name: Ingest LGU timetable

# DISABLED until DATABASE_URL points at a hosted Postgres.
#
# The scheduled trigger below is intentionally commented out — leaving it enabled
# now would run against a database that does not exist. When a hosted Postgres is
# ready:
#   1. Add repo secrets: DATABASE_URL and (if the portal needs auth) LGU_PHPSESSID.
#   2. Uncomment the `schedule` block to run it daily.
# The manual `workflow_dispatch` trigger is available for on-demand test runs.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * *' # daily at 02:00 UTC

concurrency:
  group: ingest-lgu
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SOURCE_MODE: live
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LGU_PHPSESSID: ${{ secrets.LGU_PHPSESSID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingestion
        run: pnpm ingest:lgu

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `LGU ingestion failed: run ${context.runId}`;
            const body = `The scheduled LGU timetable ingestion failed.\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ingestion', 'bug'],
            });
