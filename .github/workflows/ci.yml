name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · format · build · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  integration:
    name: integration (Postgres + RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://campusos_app:campusos_dev_password@localhost:5432/campusos_dev
      TEST_DATABASE_URL: postgres://campusos_app:campusos_dev_password@localhost:5432/campusos_test
      # Migrations and test resets run as the schema owner; the app role owns
      # nothing and holds no DDL or TRUNCATE. See docs/db-role-split.md.
      MIGRATION_DATABASE_URL: postgres://campusos_owner:campusos_dev_password@localhost:5432/campusos_dev
      TEST_MIGRATION_DATABASE_URL: postgres://campusos_owner:campusos_dev_password@localhost:5432/campusos_test
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap roles and databases
        run: psql -h localhost -U postgres -f scripts/db-bootstrap.sql

      - name: Run all migrations
        run: pnpm db:migrate:all

      # Runs every package's test:integration — db RLS isolation AND the
      # timetable module's enriched-read tests.
      - name: Integration tests (RLS isolation + module reads)
        run: pnpm test:integration

  e2e:
    name: e2e smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgres://campusos_app:campusos_dev_password@localhost:5432/campusos_dev
      TEST_DATABASE_URL: postgres://campusos_app:campusos_dev_password@localhost:5432/campusos_test
      # Migrations and test resets run as the schema owner; the app role owns
      # nothing and holds no DDL or TRUNCATE. See docs/db-role-split.md.
      MIGRATION_DATABASE_URL: postgres://campusos_owner:campusos_dev_password@localhost:5432/campusos_dev
      TEST_MIGRATION_DATABASE_URL: postgres://campusos_owner:campusos_dev_password@localhost:5432/campusos_test
      # Nested-host model (playwright.config.ts sets the same on the web server):
      # tenants are {slug}.localhost:3100, the bare host is the platform root, and
      # a DISTINCT legacy APP_DOMAIN drives the 308 in tenant-host.spec.ts.
      TENANT_BASE_DOMAIN: localhost:3100
      PLATFORM_HOST: localhost:3100
      APP_DOMAIN: legacy.test
      SOURCE_MODE: fixture
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap roles and databases
        run: psql -h localhost -U postgres -f scripts/db-bootstrap.sql

      - name: Migrate and seed
        run: pnpm db:migrate:all && pnpm db:seed

      - name: Ingest LGU fixtures
        run: pnpm ingest:lgu

      - name: Build web
        run: pnpm --filter web build

      - name: Install Playwright browser
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run e2e smoke
        run: pnpm --filter web test:e2e
